{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ label }} — enter score</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@20..72,400;20..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/css/home.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/writing.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/auth.css' %}">
</head>
<body>
  <div class="shell narrow">

    <header class="topbar">
      <h1>Enter your {{ label }} score</h1>
      <a class="settings-link" href="{% url 'home' %}">Back home</a>
    </header>

    <form method="post" class="setup-form" novalidate>
      {% csrf_token %}
      <div class="form-row">
        <label class="field-label" for="{{ form.score.id_for_label }}">Score (out of 40)</label>
        {{ form.score }}
      </div>
      <button type="submit" class="primary-btn">Save record</button>
    </form>

  </div>
</body>
</html>
