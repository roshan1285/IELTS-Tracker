{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@20..72,400;20..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/css/home.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/writing.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/practice.css' %}">
</head>
<body>

  <header class="sheet-bar">
    <span class="sheet-title">Reading — <span id="passage-label">Passage 1</span></span>
    <div class="timer" id="timer" data-seconds="3600">60:00</div>
  </header>

  <div class="shell">
    <p class="practice-sub">
      Passage changes at 15 and 35 minutes. The sheet submits automatically when the timer hits zero.
    </p>

    <form method="post" id="reading-form">
      {% csrf_token %}
      {% include "core/answer_grid.html" %}
      <button type="submit" class="primary-btn grid-submit">Submit answers</button>
    </form>
  </div>

  <script src="{% static 'core/js/reading/reading_timer.js' %}"></script>
</body>
</html>
