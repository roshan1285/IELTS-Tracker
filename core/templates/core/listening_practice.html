{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@20..72,400;20..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/css/home.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/writing.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/practice.css' %}">
</head>
<body>
  <div class="shell">

    <header class="topbar">
      <h1>Listening</h1>
      <a class="settings-link" href="{% url 'home' %}">Back home</a>
    </header>

    <p class="practice-sub">
      Note your answers as you go if you're sitting a test right now, or leave the sheet blank and just log your score.
    </p>

    <form method="post">
      {% csrf_token %}
      {% include "core/answer_grid.html" %}
      <button type="submit" class="primary-btn grid-submit">Submit answers</button>
    </form>

  </div>
</body>
</html>
